<mat-toolbar class="main-nav">
  <img src="assets/logo.jpg" routerLink="/" alt="Main logo">
  <div class="nav-links">
    <button mat-button routerLink="/hotels">Hoteles</button>
    @if(userLoggedIn) {
      <button mat-button routerLink="/reservations">Reservas</button>
      @if(userAdmin) {
        <button mat-button routerLink="/requests">Solicitudes</button>
      } @else {
        <button mat-button routerLink="/reviews">Deja una reseña</button>
      }
    }
  </div>
  <span class="spacer"></span>
  <div class="auth-links">
    @if(!userLoggedIn) {
    <button class="action-button" routerLink="/login">Iniciar sesión</button>
    <button class="action-button" routerLink="/register">Registrarse</button>
    } @else {
    <button class="red-action-button" (click)="logout()">Cerrar sesión</button>
    }
  </div>
</mat-toolbar>
