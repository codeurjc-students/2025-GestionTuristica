<mat-toolbar class="main-nav">
  <img src="assets/logo.svg" routerLink="/" alt="Main logo">
  <div class="nav-links">
    <button mat-button routerLink="/hotels">HOTELES</button>
    @if(userLoggedIn) {
      <button mat-button routerLink="/reservations">RESERVAS</button>
      @if(userAdmin) {
        <button mat-button routerLink="/requests">SOLICITUDES</button>
        <button type="button" class="primary-button" [routerLink]="['/hotels/create']">Crear hotel</button>
      } @else {
        <button mat-button routerLink="/reviews">RESEÑAS</button>
      }
    }
  </div>
  <span class="spacer"></span>
  <div class="auth-links">
    @if(!userLoggedIn) {
    <button class="primary-button" routerLink="/login">Iniciar sesión</button>
    <button class="primary-button" routerLink="/register">Registrarse</button>
    } @else {
    <button class="tertiary-button" (click)="logout()">Cerrar sesión</button>
    }
  </div>
</mat-toolbar>
