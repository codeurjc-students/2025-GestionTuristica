<h1 class="section-title"> Editar hotel</h1>

<div class="hotel-edit-form">
  <form (ngSubmit)="submit()" #f="ngForm" class="hotel-form">
    <div class="hotel-info-wrapper">
      <div class="name-wrapper">
        <label for="hotel-name">Nombre</label>
        <input id="hotel-name" name="name" [(ngModel)]="hotelModel.name" required/>
      </div>

      <div class="description-wrapper">
        <label for="hotel-description">Descripción</label>
        <textarea id="hotel-description" name="description" [(ngModel)]="hotelModel.description"></textarea>
      </div>

      <div class="country-wrapper">
        <label for="hotel-country">País</label>
        <input id="hotel-country" name="country" [(ngModel)]="hotelModel.country" required/>
      </div>

      <div class="city-wrapper">
        <label for="hotel-city">Ciudad</label>
        <input id="hotel-city" name="city" [(ngModel)]="hotelModel.city" required/>
      </div>

      <div class="address-wrapper">
        <label for="hotel-address">Dirección</label>
        <input id="hotel-address" name="address" [(ngModel)]="hotelModel.address" required/>
      </div>

      <div class="stars-wrapper">
        <div>Estrellas</div>
          <app-star-rating [rating]="hotelModel.stars" [editable]="true" [allowHalfStars]="false" (valueChange)="hotelModel.stars"></app-star-rating>
      </div>
    </div>

    <h2 class="section-subtitle">Habitaciones</h2>

    <div class="rooms-list">
      @for (room of hotelModel.rooms; track room.name; let i = $index) {
        <div class="room-card">
          <div class="room-name">{{room.name}}</div>
          <div class="room-description">{{room.description}}</div>
          <div class="room-price">{{room.price}}€</div>
          <div class="room-actions">
            <button class="red-action-button" type="button" (click)="removeRoom(room)">Eliminar</button>
            <button class="action-button" type="button" (click)="startRoomUpdate(room, i)">Editar</button>
          </div>
        </div>
      }
    </div>

    @if(!showForm){ 
      <div class="actions">
        <button class="action-button" type="button" (click)="startRoomCreation()">Añadir habitación</button>
      </div>
    }
    @if(showForm){
      <div class="room-creation-wrapper">
        <h4 class="section-subtitle">Nueva habitación</h4>
        <div class="name-wrapper">
          <label for="room-name">Nombre</label>
          <input id="room-name" name="roomName" [(ngModel)]="roomModel.name" required/>
        </div>

        <div class="description-wrapper">
          <label for="room-description">Descripción</label>
          <textarea id="room-description" name="roomDescription" [(ngModel)]="roomModel.description" required> </textarea>
        </div>

        <div class="price-wrapper">
          <label for="room-price">Precio €</label>
          <input id="room-price" name="roomPrice" [(ngModel)]="roomModel.price" type="number" required/>
        </div>

        <div class="actions">
          @if(creatingRoom){
            <button class="action-button" type="button" (click)="addRoom()">Crear habitación</button>
            <button class="red-action-button" type="button" (click)="cancelRoomUpdate()">Cancelar creación habitación</button>
          } 
          @if(updatingRoom){
            <button class="action-button" type="button" (click)="updateRoom()">Actualizar habitación</button>
            <button class="red-action-button" type="button" (click)="cancelRoomUpdate()">Cancelar actualización</button>
          }
        </div>
      </div>
    }

    <div class="actions">
      <button class="action-button" type="submit">Guardar cambios</button>
      <button class="red-action-button" type="button" (click)="cancel()">Cancelar</button>
    </div>
  </form>
</div>
