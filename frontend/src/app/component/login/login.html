<h1 class="section-title">Iniciar sesión</h1>

<div class="login-box card">
    <form (ngSubmit)="login(loginForm)" #loginForm="ngForm">
        <div class="login-inputs">
            <div class="email-wrapper">
                <input type="email" placeholder="Correo electrónico" class="text-input" [(ngModel)]="email" name="email" id="email" required/>
            </div>
            <div class="password-wrapper">
                <input type="password" placeholder="Contraseña" class="text-input" [(ngModel)]="password" name="password" id="password" required/>
            </div>
        </div>
        <div class="login-actions">
            <p>¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
            <button class="primary-button" type="submit"> Iniciar sesión</button>
        </div>
    </form>
</div>
