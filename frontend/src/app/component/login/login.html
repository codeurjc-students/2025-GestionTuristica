<h1 class="section-title">Iniciar sesión</h1>

<div class="login-box">
    <form (ngSubmit)="login()">
        <div class="login-inputs">
            <div class="email-wrapper">
                <label for="email">Correo Electrónico</label>
                <input type="email" [(ngModel)]="email" name="email" id="email" required/>
            </div>
            <div class="password-wrapper">
                <label for="password">Contraseña</label>
                <input type="password" [(ngModel)]="password" name="password" id="password" required/>
            </div>
        </div>
        <div class="login-actions">
            <p>¿No tienes cuenta?<a routerLink="/register">Regístrate</a></p>
            <button class="action-button" type="submit"> Iniciar sesión</button>
        </div>
    </form>
</div>
