<div class="star-rating">
    @for (star of stars; track star) {
        <mat-icon 
        class="star-icon" 
        [class.editable]="editable" 
        [ngClass]="getStarIcon(star)" 
        (click)="setRating($event, star)"
        (mousemove)="updateHover($event, star)"
        (mouseleave)="clearHover()"
        >
            {{getStarIcon(star)}}
        </mat-icon>
    }

    @if(allowClear) {
        <mat-icon class="clear-button" (click)="clearRating()">close</mat-icon>
    }
</div>
