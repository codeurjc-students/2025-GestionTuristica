<div class="modal-overlay" (click)="cancel()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <h2 class="modal-title"> {{data.title}} </h2>
        <mat-dialog-content> {{data.message}} </mat-dialog-content>
        <mat-dialog-actions class="modal-actions">
            @if(data.type === 'confirmation') {
            <button class="primary-button" (click)="confirm()">{{data.confirmText ?? 'Aceptar'}}</button>
            <button class="secondary-button" (click)="cancel()">{{data.cancelText ?? 'Cancelar'}}</button>
            } @else {
                <button class="primary-button" (click)="cancel()">Cerrar</button>
            }
        </mat-dialog-actions>
    </div>
</div>
