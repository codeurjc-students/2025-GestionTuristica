<h1 class="section-title">Crear hotel</h1>

<div class="hotel-creation-form">
  <form (ngSubmit)="submit()" #f="ngForm" class="hotel-form">
    <div class="hotel-info-wrapper">
      <div class="name-wrapper">
        <label for="hotel-name">Nombre</label>
        <input id="hotel-name" name="name" [(ngModel)]="hotelModel.name" required/>
      </div>

      <div class="description-wrapper">
        <label for="hotel-description">Descripción</label>
        <textarea id="hotel-description" name="description" [(ngModel)]="hotelModel.description" maxlength="500" required></textarea>
        <p>{{hotelModel.description.length}}/500 caracteres</p>
      </div>

      <div class="country-wrapper">
        <label for="hotel-country">País</label>
        <input id="hotel-country"  name="country" [(ngModel)]="hotelModel.country" required/>
      </div>

      <div class="city-wrapper">
        <label for="hotel-city">Ciudad</label>
        <input id="hotel-city" name="city" [(ngModel)]="hotelModel.city" required/>
      </div>

      <div class="address-wrapper">
        <label for="hotel-address">Dirección</label>
        <input id="hotel-address" name="address" [(ngModel)]="hotelModel.address" required/>
      </div>

      <div class="stars-wrapper">
        <div>Estrellas</div>
        <app-star-rating [rating]="hotelModel.stars" [editable]="true" [allowHalfStars]="false"
                         (valueChange)="hotelModel.stars = $event"></app-star-rating>
      </div>
    </div>

    <h3 class="section-subtitle"> Habitaciones</h3>
    <div class="rooms-list">
      @for (room of hotelModel.rooms; track room.name) {
      <div class="room-card">
        <div class="room-name">{{room.name}}</div>
        <div class="room-description">{{room.description}}</div>
        <div class="room-price">{{room.price}}€</div>
        <button class="red-action-button" type="button" (click)="removeRoom(room)">Eliminar habitación</button>
      </div>
      }
    </div>

    @if (!showForm) {
    <div class="actions">
      <button class="action-button" type="button" (click)="toggleRoomFormVisibility()">Añadir habitación</button>
    </div>
    }

    @if (showForm) {
    <div class="room-creation-wrapper">
      <h4 class="section-subtitle">Nueva habitación</h4>

      <div class="name-wrapper">
        <label for="room-name">Nombre</label>
        <input id="room-name" name="room-name" [(ngModel)]="roomModel.name" required/>
      </div>

      <div class="description-wrapper">
        <label for="room-description">Descripción</label>
        <textarea id="room-description" name="room-description" [(ngModel)]="roomModel.description" maxlength="500" required></textarea>
        <p>{{roomModel.description.length}}/500 caracteres</p>
      </div>

      <div class="price-wrapper">
        <label for="room-price">Precio €</label>
        <input id="room-price" name="room" [(ngModel)]="roomModel.price" required/>
      </div>

      <div class="actions">
        <button class="action-button" type="button" (click)="addRoom()">Crear habitación</button>
        <button class="red-action-button" type="button" (click)="cancelRoomCreation()">Cancelar creación habitación
        </button>
      </div>
    </div>
    }

    <div class="actions">
      <button class="action-button" type="submit">Crear hotel</button>
      <button class="red-action-button" type="button" (click)="cancel()">Cancelar</button>
    </div>
  </form>
</div>
