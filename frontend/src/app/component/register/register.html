<h1 class="section-title">Registrarse</h1>

<div class="register-box card">
    <form (ngSubmit)="register(registerForm)" #registerForm="ngForm">
        <div class="register-inputs">
            <div class="name-wrapper">
                <input type="text" placeholder="Nombre" class="text-input" [(ngModel)]="name" name="name" id="name" required/>
            </div>
            <div class="email-wrapper">
                <input type="email" placeholder="Correo electrónico" class="text-input" [(ngModel)]="email" name="email" id="email" required/>
            </div>
            <div class="password-wrapper">
                <input type="password" placeholder="Contraseña" class="text-input" [(ngModel)]="password" name="password" id="password" required/>
            </div>
            <div class="register-actions">
                <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
                <button class="primary-button" type="submit"> Registrarse</button>
            </div>
        </div>
    </form>
</div>
