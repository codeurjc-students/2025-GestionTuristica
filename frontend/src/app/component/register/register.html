<h1 class="section-title">Registrarse</h1>

<div class="register-box">
    <form (ngSubmit)="register()">
        <div class="register-inputs">
            <div class="name-wrapper">
                <label for="name">Nombre</label>
                <input type="text" [(ngModel)]="name" name="name" id="name" required/>
            </div>
            <div class="email-wrapper">
                <label for="email">Correo Electrónico</label>
                <input type="email" [(ngModel)]="email" name="email" id="email" required/>
            </div>
            <div class="password-wrapper">
                <label for="password">Contraseña</label>
                <input type="password" [(ngModel)]="password" name="password" id="password" required/>
            </div>
            <div class="register-actions">
                <p>¿Ya tienes cuenta?<a routerLink="/login">Inicia sesión</a></p>
                <button type="submit"> Registrarse</button>
            </div>
        </div>
    </form>
</div>
