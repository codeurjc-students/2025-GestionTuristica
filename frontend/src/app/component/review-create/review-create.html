<h1 class="section-title">Crear reseña</h1>

<div class="review-creation-wrapper">
    <h2 class="section-subtitle"> Reseña </h2>
    <form (ngSubmit)="createReview()" #f="ngForm" class="review-form">
        <div class="message-wrapper">
            <label for="message">Mensaje</label>
            <textarea id="message" class="message-input" name="message" [(ngModel)]="message" maxlength="500" required></textarea>
            <p>{{message.length}}/500 caracteres</p>
        </div>

        <div class="rating-wrapper">
            Valoración
            <div class="rating-selector">
                <app-star-rating [rating]="rating" [editable]="true" (valueChange)="rating = $event"></app-star-rating> {{rating}}/5
            </div>
        </div>

        <div class="review-creation-actions">
            <button class="action-button" type="submit"> Crear reseña</button>
            <button class="red-action-button" (click)="cancel()">Cancelar</button>
        </div>
    </form>
</div>
